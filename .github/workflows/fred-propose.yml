name: Fred Propose

# Runs daily at 21:37 UTC (22:37 UK BST / 21:37 GMT).
# Off-peak minute to dodge GitHub's scheduled-workflow delay; proposals land
# on Joel's phone overnight so he reads them with morning coffee.
# Manual trigger via Actions tab also enabled for testing.

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fred-propose
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Fred propose
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_QUIZ_TABLE_ID: ${{ secrets.AIRTABLE_QUIZ_TABLE_ID }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API }}
          FRED_SECRET: ${{ secrets.FRED_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fred-propose.mjs

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/telegram-notify.mjs --emoji "❌" --title "Fred propose FAILED" --body "No proposals generated today. Check the run logs:

          $RUN_URL"
