name: Daily Morning Brief

# Runs daily at 05:23 UTC (06:23 BST / 05:23 GMT).
# Off-peak minute to dodge GitHub's scheduled-workflow delay; brief arrives on Joel's phone
# around 06:00–07:30 UK even with 30–90 min platform delay.
# Manual trigger via Actions tab also enabled for testing.

on:
  schedule:
    - cron: '23 2 * * *'  # was 05:23; GitHub runs ~4h late, so this lands ~06:00-08:00 UK
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_SECRET: ${{ secrets.FRED_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/daily-brief.mjs

      # Daily, from 14 days out (audit, 27 Sep). Blog shares AND native posts both stop when the login expires.
      - name: Warn if the LinkedIn login is about to expire
        env:
          EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DAYS=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          echo "LinkedIn login expires in $DAYS days."
          if [ "$DAYS" -le 14 ]; then
            node scripts/telegram-notify.mjs --emoji "🔑" --title "LinkedIn login expires in $DAYS days" --body "All LinkedIn posting stops when it does. Open Claude and say: reconnect LinkedIn. It takes one click on Allow."
          fi

      - name: Tell Joel it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/telegram-notify.mjs --emoji "❌" --title "Morning brief failed" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
