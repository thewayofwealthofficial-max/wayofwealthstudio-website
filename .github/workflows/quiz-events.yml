name: Quiz Events

# Runs every 15 min (offset minutes to dodge GitHub's :00 scheduled-workflow delay).
# One cron does two jobs — the script decides what to emit based on current UTC time:
#   • EVERY run: check Airtable for new quiz_complete events → immediate Telegram ping
#   • 19:00–20:00 UTC window (once/day): also emit the daily rollup summary (starts + drop-offs)
# Cadence: "Quiet" — hot signals fire instantly, soft signals are batched to 20:00 UK.
#
# State is persisted in .github/state/quiz-last-seen.json (committed each run if changed).
# Manual trigger via Actions tab also enabled for testing.

on:
  schedule:
    - cron: '23,38,53,8 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiz-events
  cancel-in-progress: false

jobs:
  poll-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Poll quiz events
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_QUIZ_TABLE_ID: ${{ secrets.AIRTABLE_QUIZ_TABLE_ID }}
        run: node scripts/quiz-events.mjs

      - name: Commit state file if changed
        run: |
          git config user.name "Way of Wealth Bot"
          git config user.email "bot@thewayofwealth.shop"
          git add .github/state/quiz-last-seen.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "chore(state): update quiz-last-seen cursor"
          git push

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/telegram-notify.mjs --emoji "❌" --title "Quiz events poll FAILED" --body "Check the run logs:

          $RUN_URL"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Quiz events poll failed — ${new Date().toISOString().slice(0,16)}`,
              body: `The quiz-events workflow failed.\n\n**Run logs:** ${runUrl}\n\n**Common causes:**\n- AIRTABLE_TOKEN rotated or revoked\n- AIRTABLE_QUIZ_TABLE_ID mismatch\n- Airtable schema change (field rename — "Session ID" / "Step" / "Source" / "Device")\n- State file corruption in .github/state/quiz-last-seen.json\n- Telegram API outage\n\nNo quiz notifications delivered for this interval.`,
              labels: ['automation-failure', 'quiz-events']
            });
