name: Weekly Queue Topup

# Every Sunday: finds new blog questions from Google search suggestions (UK/US/AU/CA) and
# Personal Finance Stack Exchange, lets Claude pick the best, and adds them to
# src/content/reddit-queue.md so the daily blog never runs dry. Keeps ~28 waiting.
# (Replaced the Reddit scraper, which Reddit's API policy killed in June 2026.)

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be added, change nothing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-queue-topup
  cancel-in-progress: false

jobs:
  topup-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Topup queue
        id: topup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/topup-blog-queue.mjs ${{ inputs.dry_run && '--dry' || '' }}

      - name: Commit + push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Way of Wealth Bot"
          git config user.email "bot@thewayofwealth.shop"
          git add src/content/reddit-queue.md
          if git diff --staged --quiet; then
            echo "No queue changes."
            exit 0
          fi
          COUNT="${{ steps.topup.outputs.count }}"
          git commit -m "queue: weekly topup (${COUNT:-?} new questions)" -m "From Google search suggestions and Personal Finance Stack Exchange. Picked by Claude."
          git pull --rebase
          git push

      - name: Notify Telegram on success
        if: success() && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT="${{ steps.topup.outputs.count }}"
          QUEUED=$(grep -c "| 🔵 |" src/content/reddit-queue.md || echo "?")
          node scripts/telegram-notify.mjs --emoji "🔍" --title "Weekly blog topics" --body "+${COUNT:-0} new questions added.

          Queue now: $QUEUED waiting."

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node scripts/telegram-notify.mjs --emoji "❌" --title "Weekly blog topics FAILED" --body "The queue was not topped up this week. Daily posts continue until it empties. Logs:

          $RUN_URL"
