name: List Emails

# The rhythm from 5 Nov 2026 (Joel: 2 a week, value only, Tue and Thu ~8:00 UK), sent through Resend:
#   Tue ~08:00 UK   letter
#   Thu ~08:00 UK   The Thursday Money Note
# (2 Nov to 5 Nov 2026 it was Sun 13:40 letter and Fri 07:47 Finance Fridays.)
# Scheduled runs happen only when the repo variable DAILY_EMAIL_ENABLED is 'true'.
# Scheduled runs send live to the list (Joel, 5 Nov 2026). Manual runs pick a mode: dry, review or live.
# Crons are UTC. 08:10 UTC = 08:10 UK in winter, 09:10 in summer time. GitHub runs them late anyway.

on:
  schedule:
    - cron: '10 8 * * 2'
    - cron: '10 8 * * 4'
  # Netlify's email-dispatch function starts it on time (GitHub's cron above runs hours late; kept as a backup).
  repository_dispatch:
    types: [daily-email]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry (Telegram only), review (email Joel only) or live (send to the list)'
        type: choice
        options: [dry, review, live]
        default: dry
      type:
        description: 'Email type (auto = by weekday)'
        type: choice
        options: [auto, letter, post, fridays]
        default: auto

permissions:
  contents: read

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_EMAIL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Draft, check and send
        env:
          # 5 Nov 2026 (Joel): scheduled emails send to the list automatically after the checks.
          DAILY_EMAIL_MODE: ${{ github.event_name != 'workflow_dispatch' && 'live' || inputs.mode }}
          EMAIL_TYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.type != 'auto') && inputs.type || '' }}
          TEST_EMAIL: joeleezekiel@gmail.com
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Copies MailerLite sign-ups and unsubscribes into Resend before each live send (audit fix, 27 Sep).
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DAILY_EMAIL_FOOTER_ADDRESS: ${{ vars.DAILY_EMAIL_FOOTER_ADDRESS }}
        run: node scripts/daily-email/send-daily.mjs
