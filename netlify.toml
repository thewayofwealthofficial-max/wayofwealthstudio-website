# Netlify config for the Way of Wealth Astro site.
# Astro build config lives in astro.config.mjs — this file adds the Netlify
# Functions directory + the Fred approve route.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route Fred's approve link to the function. Keeps the site pure-SSG
# (Astro output stays in dist/) while giving us one dynamic endpoint.
# Domain move (Joel, 2026-09-26): every old .shop address 301s to the same page on the .com.
# Must stay ABOVE all other redirects. Netlify function paths (/api/*) are matched first by host here too,
# so they move with it; the .com serves the same functions.
[[redirects]]
  from = "https://thewayofwealth.shop/*"
  to = "https://wayofwealthcoaching.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.thewayofwealth.shop/*"
  to = "https://wayofwealthcoaching.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://thewayofwealth.shop/*"
  to = "https://wayofwealthcoaching.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.thewayofwealth.shop/*"
  to = "https://wayofwealthcoaching.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/fred/approve"
  to = "/.netlify/functions/fred-approve"
  status = 200
  force = true

# The Money Story Diagnostic's Calendly webhook tells the email robot when someone books or cancels.
[[redirects]]
  from = "/api/sequence/booked"
  to = "/.netlify/functions/sequence-booked"
  status = 200
  force = true

# LinkedIn native-post drafts: stored privately, approved by Joel from Fred's link.
[[redirects]]
  from = "/api/linkedin/draft"
  to = "/.netlify/functions/linkedin-draft"
  status = 200
  force = true

# Lead-magnet email-capture endpoint. POST { email, name, magnet, honeypot }.
# Adds to the matching MailerLite group (per MAGNET_GROUP_MAP in the function).
[[redirects]]
  from = "/api/lead-magnet/subscribe"
  to = "/.netlify/functions/lead-magnet-subscribe"
  status = 200
  force = true

# Unsubscribe link in sequence emails (GET = confirm page, POST = unsubscribe).
[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200
  force = true

# Email sequences: sends whatever is due, every hour.
[functions."sequence-runner"]
  schedule = "@hourly"

# Starts the list emails on time (GitHub's own scheduler runs hours late). See the function for the times.
[functions."email-dispatch"]
  schedule = "40 * * * *"

# Retired pages (Joel, 2026-09-26): old tools and funnels, sent to the live pages
[[redirects]]
  from = "/budget-tracker"
  to = "/reset"
  status = 301
[[redirects]]
  from = "/thanks/budget-tracker"
  to = "/reset"
  status = 301
[[redirects]]
  from = "/cash-flow-model"
  to = "/reset"
  status = 301
# The old cash flow tool. Google's one 404 (Search Console, 27 Sep); old IG posts link here too.
[[redirects]]
  from = "/cash-flow"
  to = "/reset"
  status = 301
[[redirects]]
  from = "/cash-flow-booking"
  to = "/coaching#apply"
  status = 301
